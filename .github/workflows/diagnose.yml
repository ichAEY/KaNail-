name: Diagnose Ka Nail Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run the exact Pages build and capture diagnostics
        shell: bash
        run: |
          set +e
          REPORT="$GITHUB_WORKSPACE/deploy-diagnostic.txt"
          : > "$REPORT"
          echo "Ka Nail Pages diagnostic" >> "$REPORT"
          echo "Commit: $GITHUB_SHA" >> "$REPORT"
          echo "Started: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$REPORT"

          run_step() {
            echo "" >> "$REPORT"
            echo "===== $1 =====" >> "$REPORT"
            shift
            "$@" >> "$REPORT" 2>&1
            code=$?
            echo "EXIT_CODE=$code" >> "$REPORT"
            return $code
          }

          status=0
          run_step "clone template" git clone https://github.com/ichAEY/claytone-current.git template || status=$?
          if [ "$status" -eq 0 ]; then
            run_step "checkout pinned template" git -C template checkout 89647b7d61ebcdfd43f74de2afa4d81b3dfb0194 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            mkdir -p template/public/assets
            cp site-data.mjs template/site-data.mjs
            cp scripts/customize-ka.mjs template/scripts/customize-ka.mjs
            cp omastereiglavnayanapk.png template/public/assets/karina.png
            cp favicon.svg template/public/favicon.svg
            printf '' > template/public/noop.js
            for n in $(seq 1 13); do
              printf -v padded '%02d' "$n"
              cp "$n.png" "template/public/assets/work-${padded}.png"
            done
          fi
          if [ "$status" -eq 0 ]; then
            (cd template && run_step "npm ci" npm ci) || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            (cd template && run_step "generate TANEM customer site" node scripts/generate-site.mjs) || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            (cd template && run_step "apply Ka Nail cleanup" node scripts/customize-ka.mjs) || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            rm -rf template/public/_next
            node - <<'NODE' >> "$REPORT" 2>&1
          const fs = require('fs');
          const path = 'template/tsconfig.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.exclude = [
            ...(config.exclude || []),
            'db/**', 'worker/**', 'examples/**', 'build/**', 'drizzle/**',
            'drizzle.config.ts', 'vite.config.ts'
          ];
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE
            code=$?
            echo "" >> "$REPORT"
            echo "===== remove public/_next + patch tsconfig =====" >> "$REPORT"
            echo "EXIT_CODE=$code" >> "$REPORT"
            if [ "$code" -ne 0 ]; then status=$code; fi
          fi
          if [ "$status" -eq 0 ]; then
            (cd template && run_step "next build" npx next build) || status=$?
          fi

          echo "" >> "$REPORT"
          echo "FINAL_EXIT_CODE=$status" >> "$REPORT"
          echo "$status" > "$GITHUB_WORKSPACE/deploy-exit-code.txt"
          exit 0

      - name: Publish diagnostic report branch
        if: always()
        run: |
          git config user.name "tanem-pages-diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add deploy-diagnostic.txt deploy-exit-code.txt
          git commit -m "Pages diagnostic for $GITHUB_SHA" || true
          git push origin HEAD:deploy-diagnostics --force

      - name: Fail when build failed
        if: always()
        run: |
          code=$(cat deploy-exit-code.txt 2>/dev/null || echo 99)
          if [ "$code" != "0" ]; then
            echo "Build diagnostic failed with exit code $code"
            exit "$code"
          fi
